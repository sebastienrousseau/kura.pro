name = "cloudcdn-pro"
pages_build_output_dir = "."

# Vars baked into the deploy. Distinct from `wrangler pages secret put`
# (which stores actual secrets in Cloudflare's encrypted store).
#
# STRICT_AUTH=1 turns on fail-closed authentication. With it set, any
# /api/* request that lands without the required key (ACCOUNT_KEY,
# STORAGE_KEY, DASHBOARD_PASSWORD) returns 401 — even if those secrets
# happen to be unset in the environment. Without STRICT_AUTH the
# helpers fail OPEN when no key is configured, which is convenient for
# local `wrangler pages dev` but unacceptable in production.
#
# Local dev: leave STRICT_AUTH unset to skip the gate.
# Production: this toggle alone gives a hard backstop if a secret is
# ever accidentally cleared from the Pages dashboard.
[vars]
STRICT_AUTH = "1"

# Smart Placement co-locates the worker with the data it talks to most
# (KV reads, AI calls). Reduces tail latency on cold PoPs by 30-50ms.
[placement]
mode = "smart"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "cloudcdn-knowledge"

[[kv_namespaces]]
binding = "RATE_KV"
id = "e5688bf85dff4b16988c4a3853bb7171"

# Durable Object rate limiter — atomic increment-if-below counter.
#
# checkRateLimit() in functions/api/_shared.js auto-detects the RATE_LIMITER
# binding and falls back to the (now fail-open, see PRs #42 / #43) KV path
# when it's absent. The KV path is sufficient for current traffic; the DO is
# the upgrade for when atomic bursts or KV daily-put quota become real.
#
# ── Activation (Pages cannot host the DO class itself) ──
#
# Cloudflare Pages Functions can only *bind* to a Durable Object that lives
# in a standalone Workers project — `[[migrations]]` is Workers-only and the
# Pages git-integration deploy silently ignores it. The standalone Worker is
# scaffolded at workers/rate-limiter/ in this repo:
#
#   1. cd workers/rate-limiter && npx wrangler deploy
#      (one-time — provisions the DO namespace via the `v1` migration)
#
#   2. Uncomment the stanza below. The `script_name` is what makes the
#      binding cross-script — without it, Pages would look for the class
#      in its own Functions bundle, which (per the lesson from #44) won't
#      work.
#
#   3. Commit + push. checkRateLimit() in functions/api/_shared.js picks
#      up `env.RATE_LIMITER` automatically and switches over with zero
#      code changes; rollback is symmetric (re-comment the stanza).

[[durable_objects.bindings]]
name        = "RATE_LIMITER"
class_name  = "RateLimiterDO"
script_name = "cloudcdn-rate-limiter"

# Workers Analytics Engine — high-cardinality, low-cost per-request metrics
# (request count, latency, status, AI neuron spend, cache hit rate). When the
# binding is bound, recordMetric() in _shared.js will dispatch; when it's
# absent the call is a no-op so local dev and tests need no changes.
#
# To activate:
#   1. Enable Workers Analytics Engine on the account first — it's an
#      account-level opt-in, NOT per-project. Visit
#      https://dash.cloudflare.com/<account-id>/workers/analytics-engine
#      and click "Enable". Without this, the deploy fails with
#      `You need to enable Analytics Engine` (lesson from PR #51, which
#      was reverted in #52).
#   2. Uncomment the binding below. The dataset is provisioned on the
#      next deploy — no migration step.
#   3. Query with the WAE SQL API; see docs/observability.md.
#
# [[analytics_engine_datasets]]
# binding = "METRICS"
# dataset = "cloudcdn_metrics"

# Cloudflare Queues — webhook delivery with retries + DLQ.
# dispatchWebhook() in functions/api/webhooks.js auto-detects this binding
# and falls back to direct fire-and-forget when absent.
#
# The standalone consumer Worker that processes the queue lives at
# workers/webhook-consumer/ (Pages cannot run queue consumers — only
# Workers can).
#
# Activation:
#   1. Create the queues (Workers Paid plan; free-tier eligible up to 1M
#      ops/month):
#        npx wrangler queues create cloudcdn-webhooks
#        npx wrangler queues create cloudcdn-webhooks-dlq
#   2. Deploy the consumer:
#        cd workers/webhook-consumer && npx wrangler deploy
#   3. Uncomment the producer stanza below and push. After the Pages
#      redeploy, dispatchWebhook() switches from fire-and-forget to
#      enqueue automatically; checkRateLimit-style auto-detection means
#      no application-code change is needed.
#
# Rollback: re-comment the stanza. The consumer Worker can stay deployed
# (idle queues cost nothing).
#
# [[queues.producers]]
# binding    = "WEBHOOK_QUEUE"
# queue      = "cloudcdn-webhooks"
