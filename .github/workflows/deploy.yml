name: Deploy to Cloudflare Pages
#
# This workflow is the SOLE deploy path to Cloudflare Pages production.
# Cloudflare's own Git auto-deploy was disabled in the Pages dashboard
# (Settings → Build & deployments → Branch control → "Enable automatic
# production branch deployments" toggled off) in May 2026.
#
# Why: Cloudflare's git-integration build does NOT read binding stanzas
# from wrangler.toml (analytics_engine_datasets, queues, cross-script
# durable_objects). When both pipelines ran on every push, whichever
# finished last won the active production slot — and when CF's pipeline
# won, the bindings got dropped, leaving prod with metrics=false,
# webhookQueue=false, rateLimiter unbound. Verified by force-running
# `wrangler pages deploy` afterwards and seeing the bindings come back.
#
# Re-enabling CF's git-integration would silently re-introduce that race.
# If you ever do, mirror every binding from wrangler.toml into the Pages
# dashboard (Settings → Functions → bindings) so both pipelines produce
# identical builds.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-signatures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      - name: Verify all commits are signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # For push events, verify all commits in the push payload
          # For workflow_dispatch, verify HEAD only
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            # Handle initial push (all zeros) or force push (before SHA unreachable)
            if echo "$BEFORE" | grep -qE '^0+$'; then
              COMMITS="${{ github.sha }}"
            elif ! git cat-file -e "$BEFORE" 2>/dev/null; then
              echo "Force push detected — verifying HEAD only"
              COMMITS="${{ github.sha }}"
            else
              COMMITS=$(git rev-list "$BEFORE".."${{ github.sha }}")
            fi
          else
            COMMITS="${{ github.sha }}"
          fi

          FAILED=0
          for SHA in $COMMITS; do
            VERIFIED=$(gh api "repos/$REPO/git/commits/$SHA" --jq '.verification.verified')
            REASON=$(gh api "repos/$REPO/git/commits/$SHA" --jq '.verification.reason')
            SHORT=$(git rev-parse --short "$SHA")
            SUBJECT=$(git log -1 --format='%s' "$SHA")

            if [ "$VERIFIED" = "true" ]; then
              echo "✓ $SHORT $SUBJECT (reason: $REASON)"
            else
              echo "✗ $SHORT $SUBJECT — NOT VERIFIED (reason: $REASON)"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::Deployment blocked: one or more commits are not cryptographically signed."
            echo "All commits must be GPG or SSH signed before deploying to the edge."
            exit 1
          fi

          echo ""
          echo "All commits verified. Proceeding to deploy."

  deploy:
    needs: verify-signatures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove oversized files
        run: find . -type f -size +25M -not -path './.git/*' -delete -print

      - name: Generate build digest for provenance
        id: digest
        run: |
          find . -not -path './.git/*' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/build-manifest.txt
          DIGEST=$(sha256sum /tmp/build-manifest.txt | cut -d' ' -f1)
          echo "digest=sha256:${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: cloudcdn-pro
          subject-digest: ${{ steps.digest.outputs.digest }}

      # Build an ASCII-only commit message for the Pages deploy metadata.
      # Wrangler v4 auto-reads the latest commit subject and passes it to the
      # Cloudflare Pages API, which rejects non-ASCII characters with
      # `code: 8000111 — Invalid commit message, it must be a valid UTF-8
      # string` (the error message is misleading — the bytes ARE valid UTF-8,
      # but the API treats characters like `—` U+2014 and `→` U+2192 as
      # invalid). Strip everything outside ASCII printable + space, cap at
      # 100 chars, and pass it explicitly via --commit-message so the git
      # auto-detection path is bypassed.
      - name: Build ASCII commit message
        id: commit_msg
        run: |
          # Strip non-ASCII (Cloudflare API rejects U+2014, U+2192 etc.) AND
          # strip double-quote + backslash so the message can be safely
          # interpolated into the shell-quoted --commit-message=... below.
          # Without the quote-strip, revert commits with embedded quotes
          # (e.g. Revert "feat(...)") break the shell expansion and wrangler
          # fails to parse its arguments. Cap at 100 chars.
          msg=$(git log -1 --pretty=%s | LC_ALL=C tr -cd '[:print:][:space:]' | tr -d '"\\' | head -c 100)
          # Fallback if stripping leaves us empty
          [ -z "$msg" ] && msg="deploy ${GITHUB_SHA::7}"
          echo "msg=$msg" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=cloudcdn-pro --commit-message="${{ steps.commit_msg.outputs.msg }}"
