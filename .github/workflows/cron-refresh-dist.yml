name: Refresh /dist/ marketplace catalogue

# Re-runs scripts/dist/generate-dist-catalogue.mjs once a week, fetching
# the latest version of every package from npm / crates.io / PyPI /
# GitHub Releases, and opens a PR if `cdn/en/dist/_dist.json` changed.
# Keeps the marketplace versions fresh without a developer touching it.
#
# The PR is opened by github-actions[bot] and labelled `auto`, so it's
# easy to filter in the dependabot/automerge tooling later.
#
# Manual trigger is also wired for ad-hoc refreshes.

on:
  schedule:
    # Monday 06:00 UTC — early-week, after weekend dependency churn.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-dist-catalogue
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    name: Refresh + open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Regenerate the catalogue
        run: node scripts/dist/generate-dist-catalogue.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet cdn/en/dist/_dist.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version drift since last refresh."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Surface a short summary so the workflow run page tells the
            # whole story without clicking through to the PR.
            {
              echo "## Catalogue refresh — pending PR"
              echo ""
              echo "\`\`\`diff"
              git -c color.diff=never diff --unified=0 cdn/en/dist/_dist.json \
                | grep -E '^[+-]' \
                | grep -v '^---' \
                | grep -v '^+++' \
                | head -200
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open / update the refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
        with:
          branch: chore/dist-catalogue-refresh
          delete-branch: true
          base: main
          commit-message: 'chore(dist): auto-refresh marketplace catalogue versions'
          # sign-commits: true uses the GitHub Apps API to commit via
          # github-actions[bot], which produces a GitHub-verified
          # signature. Without this, the repo's verify-signatures gate
          # blocks the auto-PR from merging.
          sign-commits: true
          title: 'chore(dist): auto-refresh marketplace catalogue'
          body: |
            Automated refresh of `cdn/en/dist/_dist.json` — pulls the
            latest published version of every package in
            `scripts/dist/packages-catalogue.json` from npm, crates.io,
            PyPI and GitHub Releases.

            Generated by `.github/workflows/cron-refresh-dist.yml`.

            Safe to squash-merge if the diff is just version bumps. If a
            package suddenly disappears (`registries[].ok: false`),
            investigate before merging — it may have been unpublished
            or renamed upstream.
          labels: |
            auto
            dist
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          signoff: false
