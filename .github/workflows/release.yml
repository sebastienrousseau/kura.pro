name: Release

# Publishes @cloudcdn/mcp-server to npm with a sigstore provenance
# attestation when a v* tag is pushed. The provenance is generated by
# npm CLI 9.5+ when run from a recognized CI provider (GitHub Actions)
# with `id-token: write` permission — npm wires it to sigstore
# automatically.
#
# The tag itself is the source of truth: the workflow checks out the
# tagged commit, runs the mcp test suite as a final gate, and only
# then publishes. A failure between checkout and publish leaves the
# tag in place but does NOT publish a broken artifact.
#
# Required repo secret:
#   NPM_TOKEN — an npm Automation token (npmjs.com → Access Tokens →
#               Granular Automation token, scoped to @cloudcdn/*).
#               Stored via Settings → Secrets → Actions.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0). Must already exist on origin.'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-mcp:
    name: Publish @cloudcdn/mcp-server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # id-token: write is what unlocks the sigstore-based provenance
    # attestation. Without it, npm publish --provenance fails fast.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.tag.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install root deps (gives us a workspace lockfile)
        run: npm ci --ignore-scripts

      - name: Install mcp deps
        working-directory: mcp
        run: npm ci --ignore-scripts

      - name: Run mcp test suite + coverage gate
        working-directory: mcp
        run: npm run test:coverage

      - name: Verify mcp version matches tag
        working-directory: mcp
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ steps.tag.outputs.ref }}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG)"
            exit 1
          fi
          echo "Version $PKG_VERSION matches tag $TAG"

      - name: Publish to npm with provenance
        working-directory: mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## :package: Published @cloudcdn/mcp-server@${{ steps.tag.outputs.ref }}";
            echo "";
            echo "- Registry: https://www.npmjs.com/package/@cloudcdn/mcp-server";
            echo "- Provenance: attached via sigstore (Settings → Provenance on the package page)";
            echo "- Tag: \`${{ steps.tag.outputs.ref }}\`";
          } >> "$GITHUB_STEP_SUMMARY"
