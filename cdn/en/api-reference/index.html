<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudCDN — API Reference</title>
  <meta name="description" content="Interactive API reference for CloudCDN. Storage, Core, Assets, Insights, Delivery, and AI endpoints with Try It console and client libraries.">
  <meta name="theme-color" content="#08090d">
  <link rel="icon" href="/favicon.ico">
  <script src="/shared/theme-boot.js"></script>
  <link rel="stylesheet" href="/shared/vendor/skeletonic/skeletonic.min.css">
  <link rel="stylesheet" href="/shared/site-nav.css">
  <link rel="stylesheet" href="/shared/theme.css">
  <script defer src="/shared/site-nav.js"></script>
  <script defer src="/shared/theme-toggle.js"></script>

  <!-- Preload spec for instant render. Absolute path because the URL
       bar lands on `/api-reference` (no trailing slash) and a relative
       `openapi.json` would resolve to /openapi.json → 404. -->
  <link rel="preload" href="/api-reference/openapi.json" as="fetch" crossorigin="anonymous">

  <style>
    body { margin: 0; background: var(--bg); color: var(--text); }

    /* Secondary bar for API-specific client downloads */
    .api-subbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.625rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-family: var(--font);
    }
    .api-subbar-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
    }
    .api-subbar .pill {
      background: var(--accent-soft);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.375rem 0.75rem;
      color: var(--accent-text);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      min-height: 2rem;
      display: inline-flex;
      align-items: center;
    }
    .api-subbar .pill:hover { background: var(--accent-soft); color: var(--heading); border-color: var(--accent); }
    .api-subbar .pill:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-nav" role="banner">
    <div class="nav-inner">
      <a class="nav-brand" href="/" aria-label="CloudCDN — home">
        <img src="/clients/cloudcdn/v1/logos/cloudcdn.svg" alt="" width="28" height="28" aria-hidden="true">
        <span class="nav-brand-text">Cloud<span class="accent">CDN</span></span>
      </a>
      <nav aria-label="Main navigation">
        <ul class="nav-center">
          <li><a href="/">Home</a></li>
          <li><a href="/api-reference">API</a></li>
          <li><a href="/dashboard/">Dashboard</a></li>
          <li><a href="/dist/">Downloads</a></li>
        </ul>
      </nav>
      <div class="nav-right">
        <button type="button" class="theme-toggle" aria-label="Switch to light mode" aria-pressed="false" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        </button>
        <a href="/dashboard/login" id="auth-link" class="nav-cta" data-logout-label="Logout">Login</a>
      </div>
      <button
        class="nav-hamburger"
        id="nav-toggle"
        type="button"
        aria-label="Toggle navigation menu"
        aria-expanded="false"
        aria-controls="nav-menu"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="api-subbar" role="region" aria-label="API client downloads">
    <span class="api-subbar-label">Client libraries:</span>
    <!-- Absolute paths because the URL bar lands on /api-reference (no
         trailing slash), so a relative `clients/foo.js` would resolve
         to /clients/foo.js — the wrong pillar. -->
    <a href="/api-reference/clients/javascript.js" class="pill" download>JavaScript</a>
    <a href="/api-reference/clients/typescript.ts" class="pill" download>TypeScript</a>
    <a href="/api-reference/clients/python.py" class="pill" download>Python</a>
    <a href="/api-reference/clients/curl.sh" class="pill" download>cURL</a>
    <a href="/api-reference/openapi.json" class="pill" download="cloudcdn-openapi.json">OpenAPI Spec</a>
  </div>

  <main id="main">
    <script
      id="api-reference"
      data-url="/api-reference/openapi.json"
      data-configuration='{
        "theme": "saturn",
        "darkMode": true,
        "layout": "modern",
        "hideDownloadButton": false,
        "searchHotKey": "k",
        "showSidebar": true,
        "defaultHttpClient": {
          "targetKey": "javascript",
          "clientKey": "fetch"
        },
        "hiddenClients": [],
        "servers": [
          { "url": "https://cloudcdn.pro", "description": "Production" },
          { "url": "http://localhost:8788", "description": "Local Dev" }
        ],
        "authentication": {
          "preferredSecurityScheme": "AccessKey",
          "apiKey": {
            "token": ""
          }
        },
        "metaData": {
          "title": "CloudCDN API Reference",
          "description": "Interactive API documentation for CloudCDN — Storage, Core, Assets, Insights, Delivery, and AI.",
          "ogDescription": "Enterprise CDN API with Try It console, client libraries, and OpenAPI 3.1 spec.",
          "ogTitle": "CloudCDN API Reference"
        }
      }'>
    </script>
    <script src="/shared/scalar-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </main>
</body>
</html>
