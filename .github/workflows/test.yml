name: Tests

on:
  push:
    branches: [main]
    # paths-ignore (not paths) — branch protection on `main` requires
    # the 7 contexts produced by this workflow. An allowlist filter
    # silently strands any PR whose changes don't match (PR #117 stuck
    # on docs; PR #119 stuck on a generated .d.ts at repo root). Inverting
    # to a small denylist guarantees every functional change triggers
    # CI by default — and the few paths below truly cannot affect runtime.
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - '.vscode/**'
      - '.idea/**'
  pull_request:
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - '.vscode/**'
      - '.idea/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Top-level least-privilege default. Individual jobs that need more
# (e.g. CodeQL needs security-events: write) declare their own
# permissions blocks. Closes CodeQL alert
# actions/missing-workflow-permissions (#72).
permissions:
  contents: read

jobs:
  ci:
    uses: sebastienrousseau/pipelines/.github/workflows/node-ci.yml@main
    with:
      node-version: '20'
      package-manager: 'npm'
      run-lint: false
      run-typecheck: false
      run-build: false
      test-coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    uses: sebastienrousseau/pipelines/.github/workflows/security.yml@main
    with:
      language: node
      severity-threshold: high
      fail-on-vulnerability: true
    permissions:
      security-events: write
      contents: read

  # CodeQL coverage for GitHub Actions workflow files themselves. Catches
  # script injection (${{ github.event.* }} into shell), unsafe ref pinning,
  # untrusted artifact use, etc. The reusable security workflow above only
  # accepts node/rust/python/go, so we run the actions analyzer inline.
  codeql-actions:
    name: CodeQL Actions Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Initialize CodeQL (actions)
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        with:
          languages: actions
          # security-extended adds the GitHub Actions query pack for known
          # workflow misconfigurations on top of the default queries.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v3
        with:
          category: '/language:actions'

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json --output-reproducible

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # Verifies every stocks/images/<name>.webp has its full responsive
  # variant set (-320, -640, -1200, -1920). Catches "added a new image
  # but forgot to run `npm run dist:responsive` before committing".
  # Pre-generated variants are the user-facing alternative to
  # /api/transform — without them, pages fall back to runtime
  # transforms which were the confirmed source of the 2026-06-23
  # bandwidth spike.
  responsive-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify every source image has all 4 responsive variants
        run: npm run dist:responsive:check

  accessibility:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright + axe-core
        run: |
          npx playwright install --with-deps chromium
          npm i -D @axe-core/playwright

      - name: Start local server
        # Serve from cdn/, not repo root. Root-anchored asset URLs in the
        # HTML (e.g. `/shared/site-nav.css`, `/en/index.html`) resolve under
        # the production Pages middleware via `/cdn/*` rewrites; the plain
        # python http.server has no such rewrite, so we change the doc root
        # instead. Serving from repo root produced a false-positive flood
        # (target-size, color-contrast) because the stylesheets 404 and the
        # elements rendered at browser-default sizes/colours — see the
        # commit message of the change that moved this line for the audit
        # output proving zero real violations.
        run: python3 -m http.server 8788 --directory cdn &

      - name: Wait for server
        run: sleep 2 && curl -sf http://localhost:8788/ > /dev/null

      - name: Run axe-core accessibility audit
        # Site-wide baseline pass (F6) brought the homepage + dashboard
        # to zero serious/critical violations in both themes. Re-enabling
        # this as a blocking gate so regressions surface immediately.
        run: |
          cat > a11y-test.mjs << 'SCRIPT'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';

          // @axe-core/playwright requires a BrowserContext-owned page —
          // calling browser.newPage() directly throws "Please use
          // browser.newContext()" since playwright 1.x.
          const browser = await chromium.launch();
          const context = await browser.newContext();
          // Server doc-root is cdn/, matching how root-anchored URLs
          // resolve under the production Pages middleware (which rewrites
          // /shared/* → /cdn/shared/* and /en/* → /cdn/en/*).
          const pages = [
            ['Homepage', 'http://localhost:8788/en/index.html'],
            ['Dashboard', 'http://localhost:8788/en/dashboard/index.html'],
          ];
          let failures = 0;
          for (const [name, url] of pages) {
            const page = await context.newPage();
            await page.goto(url, { waitUntil: 'domcontentloaded' });
            const results = await new AxeBuilder({ page }).withTags(['wcag2a', 'wcag2aa', 'wcag22aa']).analyze();
            const serious = results.violations.filter(v => v.impact === 'serious' || v.impact === 'critical');
            if (serious.length > 0) {
              console.error(`\n[FAIL] ${name}: ${serious.length} serious/critical a11y violations`);
              for (const v of serious) console.error(`  - ${v.id}: ${v.help} (${v.impact})`);
              failures += serious.length;
            } else {
              console.log(`[PASS] ${name}: 0 serious/critical violations (${results.violations.length} minor)`);
            }
            await page.close();
          }
          await context.close();
          await browser.close();
          if (failures > 0) { console.error(`\n${failures} serious/critical a11y violations found.`); process.exit(1); }
          SCRIPT
          node a11y-test.mjs

  load-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 smoke test (10 VUs, 10s)
        continue-on-error: true
        # I_KNOW_THIS_HITS_PROD=1 is the explicit opt-in required by
        # the seatbelt added in scripts/tests/load.k6.js. CI legitimately
        # needs to verify the production edge — the seatbelt's job is
        # to catch DEVELOPERS typing `k6 run ...` thinking it's local,
        # not to block CI.
        run: |
          k6 run \
            -e BASE_URL=https://cloudcdn.pro \
            -e I_KNOW_THIS_HITS_PROD=1 \
            --vus 10 \
            --duration 10s \
            --summary-trend-stats="avg,min,med,max,p(95),p(99)" \
            scripts/tests/load.k6.js

  visual-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start local server
        run: python3 -m http.server 8788 &

      - name: Wait for server
        run: sleep 2 && curl -sf http://localhost:8788/ > /dev/null

      - name: Run visual regression tests
        run: npx playwright test --config scripts/tests/playwright.config.js
        continue-on-error: true

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-report
          path: test-results/
          retention-days: 3
