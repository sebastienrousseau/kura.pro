<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudCDN — Software Distribution</title>
  <meta name="description" content="Download CLI tools and binaries distributed via CloudCDN's global edge network.">
  <meta name="theme-color" content="#08090d">
  <link rel="icon" href="/favicon.ico">
  <script src="/shared/theme-boot.js"></script>
  <link rel="stylesheet" href="/shared/vendor/skeletonic/skeletonic.min.css">
  <link rel="stylesheet" href="/shared/site-nav.css">
  <link rel="stylesheet" href="/shared/theme.css">
  <script defer src="/shared/site-nav.js"></script>
  <script defer src="/shared/theme-toggle.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* dist page-specific aliases — palette lives in theme.css */
      --mono: var(--font-mono);
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

    .container { max-width: 900px; margin: 0 auto; padding: 3rem 1.5rem; }
    h2 { font-size: 1.5rem; font-weight: 700; color: var(--heading); margin-bottom: 0.5rem; }
    .subtitle { color: var(--text-muted); margin-bottom: 2rem; }

    /* OS Detection Banner */
    .os-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .os-icon { font-size: 2rem; }
    .os-banner .detected { font-size: 0.875rem; color: var(--text-muted); }
    .os-banner .detected strong { color: var(--heading); }

    /* Package cards */
    .packages { display: grid; gap: 1rem; }
    .pkg {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      transition: border-color 0.15s;
    }
    .pkg:hover { border-color: var(--accent); }
    .pkg.recommended { border-color: var(--green-border); background: linear-gradient(135deg, var(--surface), var(--green-soft)); }
    .pkg-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .pkg-name { font-weight: 600; color: var(--heading); }
    .pkg-badge {
      font-size: 0.6875rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid var(--green-border);
    }
    .pkg-desc { font-size: 0.8125rem; color: var(--text-muted); margin-bottom: 0.75rem; }

    /* Install command */
    .install-cmd {
      background: var(--code-block-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-family: var(--mono);
      font-size: 0.8125rem;
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      overflow-x: auto;
    }
    .install-cmd code { white-space: nowrap; flex: 1; }
    .install-cmd button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.6875rem;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .install-cmd button:hover { color: var(--text); border-color: var(--text-dim); }

    /* Checksum */
    .checksum {
      font-size: 0.6875rem;
      color: var(--text-dim);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .checksum .label { color: var(--text-muted); }

    /* File grid */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .file-item {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .file-item .name { font-family: var(--mono); color: var(--accent-text); }
    .file-item .size { color: var(--text-dim); }
    .file-item.active { border-color: var(--green-border); background: var(--green-soft); }
    .file-item.active .name { color: var(--green); }

    footer { text-align: center; padding: 2rem; font-size: 0.75rem; color: var(--text-dim); border-top: 1px solid var(--border); margin-top: 2rem; }
    footer a { color: var(--text-dim); text-decoration: none; }
    footer a:hover { color: var(--accent-hover); }

    /* Toast */
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--surface-2); border: 1px solid var(--green-border); color: var(--green);
      font-size: 0.8125rem; padding: 0.5rem 1rem; border-radius: 999px; z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-nav" role="banner">
    <div class="nav-inner">
      <a class="nav-brand" href="/" aria-label="CloudCDN — home">
        <img src="/clients/cloudcdn/v1/logos/cloudcdn.svg" alt="" width="28" height="28" aria-hidden="true">
        <span class="nav-brand-text">Cloud<span class="accent">CDN</span></span>
      </a>
      <nav aria-label="Main navigation">
        <ul class="nav-center">
          <li><a href="/">Home</a></li>
          <li><a href="/api-reference">API</a></li>
          <li><a href="/dashboard/">Dashboard</a></li>
          <li><a href="/dist/">Downloads</a></li>
        </ul>
      </nav>
      <div class="nav-right">
        <button type="button" class="theme-toggle" aria-label="Switch to light mode" aria-pressed="false" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        </button>
        <a href="/dashboard/login" id="auth-link" class="nav-cta" data-logout-label="Logout">Login</a>
      </div>
      <button
        class="nav-hamburger"
        id="nav-toggle"
        type="button"
        aria-label="Toggle navigation menu"
        aria-expanded="false"
        aria-controls="nav-menu"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="main" class="container">
    <h2>Software Distribution</h2>
    <p class="subtitle">Download CLI tools and binaries delivered from 300+ edge locations. SHA-256 verified.</p>

    <!-- OS Detection -->
    <div class="os-banner" id="os-banner">
      <span class="os-icon" id="os-icon"></span>
      <div>
        <p class="detected">Detected: <strong id="os-name">detecting...</strong></p>
        <p style="font-size:0.75rem;color:var(--text-dim);margin-top:2px;" id="os-hint"></p>
      </div>
    </div>

    <!-- Packages -->
    <div class="packages" id="packages"></div>
  </main>

  <footer><a href="/">CloudCDN</a> &middot; <a href="/dashboard/">Dashboard</a> &middot; All binaries signed and SHA-256 verified</footer>

  <div class="toast" id="toast"></div>

  <script src="_dist.js" defer></script>
</body>
</html>
